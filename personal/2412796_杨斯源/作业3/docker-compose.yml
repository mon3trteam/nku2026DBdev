# 个人作业3 —— WordPress 本地部署
# 作者：杨斯源（2412796）
# 用法：docker compose up -d   然后浏览器打开 http://localhost:8080
#
# 说明：
#   - db 用 MySQL 8.0，首次启动自动建库 wordpress 与账号 wpuser；
#   - wordpress 用官方 apache 镜像，端口映射 8080；
#   - 两个数据卷保证 docker compose down 之后站点与数据库不丢。

services:
  db:
    image: mysql:8.0
    container_name: wp3-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wp_pass_2026
      MYSQL_ROOT_PASSWORD: root_pass_2026
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pass_2026"]
      interval: 5s
      timeout: 3s
      retries: 30

  wordpress:
    # 本机已有该镜像（6.9.4 / PHP 8.3 / Apache），避免现场拉取大镜像
    image: wordpress:6.9.4-php8.3-apache
    container_name: wp3-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wp_pass_2026
    volumes:
      - wp_data:/var/www/html
      # 官方镜像默认 AllowOverride None，导致 WordPress 固定链接 404；
      # 用这份配置覆盖 /var/www/ 的 AllowOverride。
      - ./apache-allow-override.conf:/etc/apache2/conf-enabled/zz-allow-override.conf:ro

volumes:
  db_data:
  wp_data:
