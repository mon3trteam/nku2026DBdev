<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>网页表格 → SQL 生成器</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header>
  <h1>网页表格 → SQL</h1>
  <div id="page-info" class="muted">正在读取当前页面…</div>
</header>

<div id="notice" class="notice" hidden></div>

<main id="main" hidden>

  <div class="field">
    <label for="table-select">选择表格</label>
    <select id="table-select"></select>
  </div>

  <div class="grid2">
    <div class="field">
      <label for="table-name">表名</label>
      <input id="table-name" type="text" spellcheck="false">
    </div>
    <div class="field">
      <label for="dialect">SQL 方言</label>
      <select id="dialect">
        <option value="mysql">MySQL</option>
        <option value="sqlite">SQLite / PostgreSQL</option>
      </select>
    </div>
  </div>

  <div class="checks">
    <label><input id="has-header" type="checkbox" checked> 首行作为表头</label>
    <label><input id="drop-table" type="checkbox" checked> 加 DROP TABLE IF EXISTS</label>
  </div>

  <div class="field inline">
    <label for="max-rows">最多导出</label>
    <input id="max-rows" type="number" min="1" max="2000" value="200">
    <span class="muted">行</span>
  </div>

  <div id="meta" class="meta"></div>

  <pre id="preview" class="preview"></pre>

  <div id="warnings" class="warnings" hidden></div>

  <div class="actions">
    <button id="btn-copy" class="primary">复制 SQL</button>
    <button id="btn-download">下载 .sql</button>
    <button id="btn-reload">重新抓取</button>
  </div>

  <div id="status" class="muted" role="status"></div>

</main>

<script src="lib/sqlbuilder.js"></script>
<script src="popup.js"></script>
</body>
</html>
