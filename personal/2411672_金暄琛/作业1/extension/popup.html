<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面标注助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo">M</div>
    <div>
      <h1>页面标注助手</h1>
      <p>选中文字后，点击下面的按钮。</p>
    </div>
  </header>

  <section class="preview">
    <span>当前选中内容</span>
    <p id="selectionPreview">尚未读取</p>
  </section>

  <div class="actions">
    <button id="highlightBtn" class="primary" type="button">高亮选中文字</button>
    <button id="readBtn" type="button">读取选中文字</button>
    <button id="clearBtn" class="danger" type="button">清除本页高亮</button>
  </div>

  <p id="status" class="status" role="status">准备就绪</p>

  <footer>
    仅在你主动点击时访问当前标签页，不会上传任何数据。
  </footer>

  <script src="popup.js"></script>
</body>
</html>
