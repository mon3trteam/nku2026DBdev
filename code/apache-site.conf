# =====================================================================
# 文件名：apache-site.conf
# 功能：Apache 默认虚拟主机配置，站点根目录统一指向 public/
# 作者：金暄琛（2411672）
# 创建日期：2026-11-08
# 所属模块：部署 / 安全
#
# 说明：
#   1) DocumentRoot 指向 public/ 后，app/config/data/storage 不在 Web 根内，
#      即使根目录 .htaccess 失效也不会被直接下载。
#   2) 上传目录 public/static/uploads 仍由其中的 .htaccess 禁止脚本执行。
#   3) 本地开发由 docker-compose.yml 挂载源码；交付镜像时由 Dockerfile COPY。
# =====================================================================

# 容器内无 FQDN，显式声明避免 apache2ctl 启动告警
ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 双保险：即使将来 DocumentRoot 被改回仓库根目录，这些目录也拒绝访问
    <Directory /var/www/html/app>
        Require all denied
    </Directory>
    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    <Directory /var/www/html/data>
        Require all denied
    </Directory>
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>

    <IfModule mod_headers.c>
        # 不暴露 PHP 版本
        Header always unset X-Powered-By
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
