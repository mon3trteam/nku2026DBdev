# =====================================================================
# 文件名：docker-compose.yml
# 功能：团队主页项目一键部署编排（web: PHP8+Apache + db: MySQL8）
# 作者：金暄琛（2411672）
# 创建日期：2026-10-29
# 所属模块：部署（加分项）
# 说明：docker compose up -d 后访问 http://localhost:8080
#       国内拉取受限时先配置镜像加速源（如 docker.m.daocloud.io）
# =====================================================================

services:
  db:
    image: mysql:8.0
    container_name: teamhome-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: team_home
      MYSQL_USER: team
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-team123456}
    volumes:
      - db_data:/var/lib/mysql
      # 首次启动自动导入建表脚本（仅 data 目录有该文件时生效）
      - ./data/install.sql:/docker-entrypoint-initdb.d/install.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  web:
    build: .
    container_name: teamhome-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 与 db 服务保持一致；生产环境用 .env 覆盖，不要把真实口令写进仓库
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: team_home
      DB_USERNAME: team
      DB_PASSWORD: ${MYSQL_PASSWORD:-team123456}
      # 应用密钥与会话配置；生产环境必须在 .env 中覆盖 APP_KEY
      APP_KEY: ${APP_KEY:-teamhub-local-demo-key-change-me}
      APP_DEBUG: ${APP_DEBUG:-false}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-1800}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
    ports:
      - "8080:80"
    volumes:
      # 源码挂载便于开发调试；发布时可改为镜像内 COPY
      - .:/var/www/html
    healthcheck:
      # 探活同时检查 Apache 与数据库；数据库不可用时返回 503
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://localhost/index.php?r=system/healthz\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
